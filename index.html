<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Dish HD - Working Channels Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .video-wrapper { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            background: #000;
        }
        
        video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: fill !important; 
            background: #000; 
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* डीडी फ्री डिश वाली सतरंगी कलर बार बैकग्राउंड */
        .color-bars-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                #ffffff 10%, #ffff00 10% 20%, 
                #00ffff 20% 30%, #00ff00 30% 40%, 
                #ff00ff 40% 50%, #ff0000 50% 60%, 
                #0000ff 60% 70%, #000000 70% 100%
            );
            z-index: 5;
        }

        /* कंपनी लोगो */
        .watermark-logo {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 140px;
            height: 140px;
            object-fit: contain;
            opacity: 0.95;
            z-index: 35;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9));
        }

        /* No Signal इमेज */
        .no-signal-image {
            position: absolute;
            width: 450px;
            height: auto;
            object-fit: contain;
            z-index: 20;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }

        /* इन्फो बार डिज़ाइन */
        .infobar-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            background: linear-gradient(to bottom, #2c3e50, #1a252f, #0d1117);
            border: 2px solid #4a5568;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
            z-index: 50;
        }

        .channel-number {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-right: 15px;
            color: #ffffff;
            min-width: 80px;
        }

        .tv-logo-box {
            width: 55px;
            height: 55px;
            border: 2px solid #718096;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2);
        }

        .tv-icon { font-size: 18px; line-height: 1; }
        .tv-text { font-size: 10px; font-weight: bold; color: #cbd5e0; }

        .center-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .channel-title-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 3px;
        }

        .channel-name {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-right: 15px;
        }

        .codec-res {
            font-size: 13px;
            color: #a0aec0;
            margin-right: 15px;
            font-weight: bold;
        }

        .provider-info {
            font-size: 13px;
            color: #cbd5e0;
            margin-top: 2px;
        }

        .no-info {
            font-size: 13px;
            color: #a0aec0;
            margin: 1px 0;
        }

        .right-panel {
            width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid #4a5568;
            padding-left: 15px;
        }

        .datetime-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .signal-bar-container {
            display: flex;
            align-items: center;
            margin: 2px 0;
            font-size: 11px;
            font-weight: bold;
        }

        .signal-label {
            width: 65px;
            color: #cbd5e0;
            font-size: 10px;
        }

        .progress-track {
            flex-grow: 1;
            height: 10px;
            background: #000;
            border: 1px solid #4a5568;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 5px;
        }

        .fill-strength {
            height: 100%;
            width: 95%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .fill-quality {
            height: 100%;
            width: 70%;
            background: linear-gradient(90deg, #3498db, #2980b9);
        }

        .signal-value {
            width: 35px;
            text-align: right;
            font-size: 11px;
        }

        .bottom-icons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            font-size: 10px;
            color: #a0aec0;
            margin-top: 5px;
            font-weight: bold;
        }

        .bottom-icons span {
            background: rgba(0,0,0,0.3);
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* ==========================================
           चैनल लिस्ट पॉप-अप बॉक्स (सटीक पुरानी पोजीशन)
           ========================================== */
        .channel-list-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            background: linear-gradient(135deg, #1b364d 0%, #0d1e2e 50%, #08121a 100%);
            border: 2px solid #3b7ca3;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(27, 108, 157, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            z-index: 100;
        }

        .channel-list-header {
            text-align: center;
            padding: 14px 0;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(74, 156, 211, 0.8);
            letter-spacing: 0.5px;
            border-bottom: 2px solid #285d82;
            background: rgba(0, 0, 0, 0.15);
        }

        .content-area {
            position: relative;
            padding: 12px 10px;
            border-bottom: 2px solid #285d82;
        }

        .scroll-track {
            position: absolute;
            right: 5px;
            top: 15px;
            bottom: 15px;
            width: 4px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 2px;
        }

        .scroll-thumb {
            position: absolute;
            top: 0px;
            width: 100%;
            height: 45px;
            background: #5398c4;
            border-radius: 2px;
            box-shadow: 0 0 5px #5398c4;
        }

        .channel-list-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 15px;
            max-height: 280px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            font-size: 16px;
            color: #ffffff;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item.active {
            border: 2px solid #e5c158;
            background: linear-gradient(90deg, rgba(229, 193, 88, 0.12) 0%, rgba(229, 193, 88, 0.03) 100%);
            box-shadow: 0 0 10px rgba(229, 193, 88, 0.4), inset 0 0 8px rgba(229, 193, 88, 0.2);
            padding: 8px 10px;
            color: #ffda73;
        }

        .ch-num {
            width: 50px;
            font-weight: 500;
        }

        .ch-name {
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* फुटर सिग्नल बार्स */
        .menu-footer {
            padding: 12px 14px;
            background: rgba(5, 12, 18, 0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .signal-row {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
        }

        .signal-label {
            width: 85px;
            letter-spacing: 0.5px;
        }

        .progress-box {
            flex-grow: 1;
            height: 12px;
            background: #050b10;
            border: 1px solid #224c6b;
            border-radius: 2px;
            padding: 1px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }

        .bar-green {
            height: 100%;
            width: 95%;
            background: linear-gradient(180deg, #66ff33 0%, #2eb82e 50%, #1f8a1f 100%);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(46, 184, 46, 0.8);
            transition: width 0.3s ease;
        }

        .bar-blue {
            height: 100%;
            width: 70%;
            background: linear-gradient(180deg, #33bbff 0%, #0088cc 50%, #0059b3 100%);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(0, 136, 204, 0.8);
            transition: width 0.3s ease;
        }

        .hidden-box { display: none !important; }
    </style>
</head>
<body>

<div class="video-wrapper">

    <div id="colorBars" class="color-bars-bg hidden-box"></div>

    <img id="noSignal" src="no-signal.png" alt="No Signal" class="no-signal-image hidden-box" onerror="this.src='https://via.placeholder.com/450x150?text=NO+SIGNAL'">

    <div id="infoBar" class="infobar-container hidden-box">

        <div class="right-panel">
            <div class="datetime-row">
                <span id="currentDate">2026/07/26</span>

            <div class="signal-bar-container">
                <span class="signal-label">STRENGTH</span>

            <div class="channel-list-items" id="channelListItems">

        <div class="menu-footer">
            <div class="signal-row">

                <div class="progress-box">
                    <div id="listStrengthBar" class="bar-green"></div>

            <div class="signal-row">
                <span class="signal-label" id="listQualityLabel">Q [70%]</span>
                <div class="progress-box">
                    <div id="listQualityBar" class="bar-blue"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const noSignalBox = document.getElementById('noSignal');
    const colorBars = document.getElementById('colorBars');
    const infoBar = document.getElementById('infoBar');
    const channelListPopup = document.getElementById('channelListPopup');
    const channelListItems = document.getElementById('channelListItems');

    let currentIndex = 0;
    let infoBarTimer = null;
    let currentHls = null;
    let okPressState = 0;

    const channels = [
        { id: "001", name: "Green Entertainment", type: "video", url: "https://cdn23lhr.tamashaweb.com:8087/jazzauth/Green_Entertainment-abr/playlist.m3u8" },

        { id: "004", name: "Cartoon Network", type: "video", url: "https://s3.ideationtec.live/Cartoon_Network/Cartoon_Network.m3u8" },
        { id: "005", name: "Shemaroo", type: "video", url: "https://cdn-3.pishow.tv/live/230/master.m3u8" },
        { id: "006", name: "Discovery Kids", type: "video", url: "https://tapmadlive.akamaized.net/tapmadold/discoverykids.smil/chunklist_w1972561511_b298000_slENG.m3u8" },
        { id: "007", name: "Discovery Channel", type: "video", url: "https://tapmadlive.akamaized.net/tapmadold/discovery.smil/chunklist_w896446047_b298000_slENG.m3u8" },
        { id: "008", name: "Sony Entertainment Television", type: "video", url: "https://stream.ottplus.live/live/sony_ent_sd_abr/live/sony_ent_sd_480/chunks.m3u8" },
        { id: "009", name: "Sony YAY!", type: "video", url: "https://stream.ottplus.live/live/sony_yay_abr/live/sony_yay_720/chunks.m3u8" },
        { id: "010", name: "9XM", type: "video", url: "https://9xjio.wiseplayout.com/9XM/SD216/SD216.m3u8" },
        { id: "011", name: "Shemaroo Chumbak TV", type: "video", url: "https://airtelapp.shemaroo.com/shemarooChumbakTV/smil:shemarooChumbakTVadp.smil/chunklist_b1628000_sleng.m3u8" },
        { id: "012", name: "Sony KAL", type: "video", url: "https://e77bef9b.wurl.com/manifest/f36d25e7e52f1ba8d7e56eb859c636563214f541/TEctY2FfU29ueUtBTF9ITFM/7d2fdb68-efbf-4636-8c9b-f928a62875af/1.m3u8" },
        { id: "013", name: "Joo Music", type: "video", url: "https://livecdn.live247stream.com/joomusic/tv/playlist.m3u8" },
        { id: "014", name: "A1 TV", type: "video", url: "https://cdn12isb.tamashaweb.com:8087/jazzauth/A1TV-abr/live/vsat-124H/chunks.m3u8" },
        { id: "015", name: "Goldmines", type: "video", url: "https://cdn-2.pishow.tv/live/1459/master.m3u8" },
        { id: "016", name: "B4U Movies", type: "video", url: "https://cdn-2.pishow.tv/live/419/master.m3u8" },
        { id: "017", name: "Shemaroo Bollywood", type: "video", url: "https://amg00864-shemarooenterta-shemabollywood-ono-nlwbw.amagi.tv/playlist/amg00864-shemarooenterta-shemabollywood-ono/cb563d1e786c6d8884cf3b78d6f562ffa65928d80b6c852a6ab454876da64607d1e3b680fd358b785d9f01de6a1a0a080361cf12ce3407c3c76ad91174204213cfcac9229d86170ab5c60c2c3aab016635837209c0790a79dca93d0d8636ba304530e01b615b37c2ec5aac6852db80148b6f4adafb8c2360625f5c98435ee3b24aa7ade15b448c6da4ac481ac37a58e683179fc94dea83d6469812d576f5179a95f9d98714e0c5ab4191a42b13733a1256dbe84992c254a5ce9b674bf31b4a672d252d270e9c3458a7544a5d8292a307dfd861a9a224936134b309da20ecd7664cd86b94c534c59eb2d1464973c3ae3e3075f3b4f1d8b85dbbda17c6af4c43a1f7c1d66d21f16c608c861b18da91ea078dc25abdb73184b76114020df02f94b0bd99e6bc814bd3708497b4d00a4b40670b15951d8cae2d8a799328f38e2428521b10f6da4d92d2901e11725f8a8569d11130b0cfc4d68c597599365b12c348ed7629208c386577e06dde9f3f67866f4aa63d2ff45530cf13afe962a5e98bab567b86dfc143ed66a0e05985b851ff1f49336884fb225b4a5b6e90bf367f5757f705b58384b10d4a6a8ad0c2f1c75f3d7d49345a1e84efe230d6cef7201312ce443522133412850fc266cf0a2b517cd17f33cd94a23cda47c2d029f3b489f22e076128914364a71b/12/848x480_1686360/index.m3u8" },
        { id: "018", name: "Goldmines Movies", type: "video", url: "https://cdn-2.pishow.tv/live/1461/master.m3u8" },
        { id: "019", name: "B4U Kadak", type: "video", url: "https://cdn-2.pishow.tv/live/227/master.m3u8" },
        { id: "020", name: "DD India", type: "nosignal", url: "" },
        { id: "021", name: "Sansad TV", type: "nosignal", url: "" }
    ];

    const ibChannelNum = document.getElementById('ibChannelNum');
    const ibChannelName = document.getElementById('ibChannelName');
    const qualityFill = document.getElementById('qualityFill');
    const qualityText = document.getElementById('qualityText');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');

    const listStrengthLabel = document.getElementById('listStrengthLabel');
    const listStrengthBar = document.getElementById('listStrengthBar');
    const listQualityLabel = document.getElementById('listQualityLabel');
    const listQualityBar = document.getElementById('listQualityBar');

    function renderChannelList() {
        channelListItems.innerHTML = "";
        channels.forEach((ch, idx) => {
            const item = document.createElement('div');
            item.className = `channel-item ${idx === currentIndex ? 'active' : ''}`;
            item.innerHTML = `<span class="ch-num">${ch.id}</span> <span class="ch-name">${ch.name}</span>`;
            item.onclick = () => {
                playChannel(idx);
                hideEverything();
            };
            channelListItems.appendChild(item);
        });
        scrollToActiveChannel();
    }

    function scrollToActiveChannel() {
        const activeItem = channelListItems.querySelector('.channel-item.active');
        if (activeItem) {
            channelListItems.scrollTop = activeItem.offsetTop - channelListItems.clientHeight / 2 + activeItem.clientHeight / 2;
        }
    }

    renderChannelList();

    function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        const dateEl = document.getElementById('currentDate');
        const timeEl = document.getElementById('currentTime');
        if (dateEl) dateEl.textContent = `${year}/${month}/${day}`;
        if (timeEl) timeEl.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    setInterval(() => {
        const ch = channels[currentIndex];
        let randomStrength = Math.floor(Math.random() * (96 - 94 + 1)) + 94;
        
        strengthFill.style.width = randomStrength + '%';
        strengthText.innerText = randomStrength + '%';

        listStrengthBar.style.width = randomStrength + '%';
        listStrengthLabel.innerText = `S [${randomStrength}%]`;

        if (ch.type === "nosignal") {
            qualityFill.style.width = '0%';
            qualityText.innerText = '0%';
            listQualityBar.style.width = '0%';
            listQualityLabel.innerText = `Q [0%]`;
        } else {
            let randomQuality = Math.floor(Math.random() * (70 - 40 + 1)) + 40;
            qualityFill.style.width = randomQuality + '%';
            qualityText.innerText = randomQuality + '%';
            
            listQualityBar.style.width = randomQuality + '%';
            listQualityLabel.innerText = `Q [${randomQuality}%]`;
        }
    }, 1500);

    function showNoSignal() {
        colorBars.classList.remove('hidden-box');
        noSignalBox.classList.remove('hidden-box');
    }

    function hideNoSignal() {
        colorBars.classList.add('hidden-box');
        noSignalBox.classList.add('hidden-box');
    }

    function hideEverything() {
        infoBar.classList.add('hidden-box');
        channelListPopup.classList.add('hidden-box');
        clearTimeout(infoBarTimer);
        okPressState = 0;
    }

    function triggerAutoInfoBar() {
        clearTimeout(infoBarTimer);
        const ch = channels[currentIndex];
        ibChannelNum.innerText = ch.id;
        ibChannelName.innerText = ch.name;
        infoBar.classList.remove('hidden-box');
        okPressState = 1;

        infoBarTimer = setTimeout(() => {
            infoBar.classList.add('hidden-box');
            okPressState = 0;
        }, 4000);
    }

    function handleOkButtonPress() {
        if (okPressState === 0) {
            triggerAutoInfoBar();
        } 
        else if (okPressState === 1) {
            clearTimeout(infoBarTimer);
            infoBar.classList.add('hidden-box');
            renderChannelList();
            channelListPopup.classList.remove('hidden-box');
            okPressState = 2;
        } 
        else if (okPressState === 2) {
            hideEverything();
        }
    }

    function playChannel(index) {
        if (index < 0) index = channels.length - 1;
        if (index >= channels.length) index = 0;
        currentIndex = index;

        if (currentHls) {
            currentHls.destroy();
            currentHls = null;
        }

        const ch = channels[currentIndex];

        let randomStrength = Math.floor(Math.random() * (96 - 94 + 1)) + 94;
        strengthFill.style.width = randomStrength + '%';
        strengthText.innerText = randomStrength + '%';
        listStrengthBar.style.width = randomStrength + '%';
        listStrengthLabel.innerText = `S [${randomStrength}%]`;

        triggerAutoInfoBar();

        if (ch.type === "nosignal") {
            video.pause();
            video.removeAttribute('src');
            video.load();
            showNoSignal();
            qualityFill.style.width = '0%';
            qualityText.innerText = '0%';
            listQualityBar.style.width = '0%';
            listQualityLabel.innerText = `Q [0%]`;
        } else {
            showNoSignal();

            if (Hls.isSupported()) {
                currentHls = new Hls({
                    xhrSetup: function(xhr, url) { xhr.withCredentials = false; },
                    autoStartLoad: true
                });
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().then(() => { hideNoSignal(); }).catch(e => {});
                });

                currentHls.on(Hls.Events.FRAG_LOADED, () => { hideNoSignal(); });

                currentHls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: currentHls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: currentHls.recoverMediaError(); break;
                            default: currentHls.destroy(); break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().then(() => { hideNoSignal(); }).catch(e => {});
                });
            }
        }
        
        renderChannelList();
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === "ArrowUp" || e.keyCode === 38 || e.key === "ChannelUp" || e.keyCode === 427) {
            e.preventDefault();
            if (okPressState === 2) {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                renderChannelList();
            } else {
                playChannel(currentIndex - 1);
            }
        }
        else if (e.key === "ArrowDown" || e.keyCode === 40 || e.key === "ChannelDown" || e.keyCode === 428) {
            e.preventDefault();
            if (okPressState === 2) {
                currentIndex = (currentIndex + 1) % channels.length;
                renderChannelList();
            } else {
                playChannel(currentIndex + 1);
            }
        }
        else if (e.key === "Enter" || e.keyCode === 13 || e.key === "Select" || e.keyCode === 23) {
            e.preventDefault();
            if (okPressState === 2) {
                playChannel(currentIndex);
                hideEverything();
            } else {
                handleOkButtonPress();
            }
        }
        else if (e.key === "Escape" || e.keyCode === 27 || e.key === "Backspace") {
            e.preventDefault();
            hideEverything();
        }
        else if (e.key === "0" || e.keyCode === 48) {
            e.preventDefault();
            let elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    });

    playChannel(0);
</script>
</body>
</html>
